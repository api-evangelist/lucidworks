- aid: lucidworks:lucidworks-solr-api
  name: Lucidworks Solr API
  description: >-
    The Solr API is used to manage collection-level configurations.


    Since this API proxies requests to Solr, each available method corresponds to the method in Solr.
    So, a `GET` request to Solr would use the `GET` method of this endpoint; a `POST` would use the `POST`
    method, and so on.


    Depending on the request, the response may consist of records that match a query or output from a
    Schema API request.
