description: >-
  Lucidworks builds AI-powered search, discovery, and agent platforms used by enterprise commerce, support, and
  workplace teams. The Lucidworks AI Platform, Fusion, Neural Hybrid Search, Agent Studio, Commerce Studio, and
  Analytics Studio expose REST APIs for prediction, embedding, classification, signals capture, query rewriting, custom
  rule management, content chunking, and model deployment.
