  name: Lucidworks Solr admin API
  description: >-
    The Solr Admin API lets you send commands to Solr through Fusion's proxy service. This allows you
    to protect your Solr instances from outside connections, and apply roles and user permissions from
    Fusion when running Solr commands. Requests sent to this API are subject to access restrictions above
    the collection level.


    Note that because one `searchCluster` may host several collections, it is not recommended to use this
    with a collection-level command (such as a query, or document update).
  humanURL: https://doc.lucidworks.com/docs/5/fusion/dev-portal/rest-apis
