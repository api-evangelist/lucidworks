- aid: lucidworks:lucidworks-blobs-api
  name: Lucidworks Blobs API
  description: >-
    The Blob Store REST API allows storing binary objects in Solr. You can use it to store entity extraction
    models, lookup lists or exclusion lists for use in index pipelines. This may include the entity extraction
    models and lookup lists included with Fusion in the `{fusion_path}/data/nlp` directory, or files that
    you have created on your own.
  humanURL: https://doc.lucidworks.com/docs/5/fusion/dev-portal/rest-apis
  baseURL: https://api.lucidworks.ai
  tags:
  - Blobs
  properties:
  - type: OpenAPI
    url: openapi/lucidworks-blobs-api-openapi.yml
- aid: lucidworks:lucidworks-collections-api
  name: Lucidworks Collections API
  description: >-
    The Collections API manages Fusion collections. It provides endpoints for creating, updating, and
    deleting collection, as well as endpoints for getting a collection's status and usage statistics.


    Fusion maintains internal system collections for logs, blobs, and metrics data which operate in conjunction
    with collections created by users. The Collections API is used to manage all Fusion collections.
  humanURL: https://doc.lucidworks.com/docs/5/fusion/dev-portal/rest-apis
  baseURL: https://api.lucidworks.ai
  tags:
  - Collections
  properties:
  - type: OpenAPI
    url: openapi/lucidworks-collections-api-openapi.yml
- aid: lucidworks:lucidworks-configurations-api
  name: Lucidworks Configurations API
  description: >-
    The Configurations API allows setting global properties for Fusion.


    Some settings are not set by any configuration file but are reported as settings from the operating
    system. Those settings cannot be changed with this API.


    > ⚠️ **Blocked by default:** This API is blocked on the API gateway by default because it exposes
    all Fusion admin service environment variables. It can be enabled in special cases — contact [Lucidworks
    Support](https://lucidworks.com/support) to discuss your use case. In Fusion 5.18 and later, use [Fusion
    Vault](/docs/5/fusion/operations/security/external-vault) instead, which provides a safer, structured
    approach to managing configuration values and secrets. The Configurations API is deprecated as of
    Fusion 5.18.
  humanURL: https://doc.lucidworks.com/docs/5/fusion/dev-portal/rest-apis
  baseURL: https://api.lucidworks.ai
  tags:
  - Configurations
  properties:
  - type: OpenAPI
    url: openapi/lucidworks-configurations-api-openapi.yml
