openapi: 3.2.0
info:
  title: Fusion Admin Swagger API
  description: These APIs provide general administrative functions for your Fusion instance. Use these APIs to manage Fusion objects, App Studio objects, connections to Solr clusters, license files, job schedules, and more. You can also use them to create a history of service events.
  termsOfService: https://lucidworks.com/legal/developer-license-agreement/
  contact:
    name: Lucidworks
    url: www.lucidworks.com
    email: support@lucidworks.com
  license:
    name: License of API
    url: https://lucidworks.com/legal/developer-license-agreement/
  version: '5.9'
servers:
- url: https://{FUSION HOST}/api
  description: Fusion
  variables:
    FUSION HOST:
      default: FUSION_HOST
      description: Your environment host.
- url: https://{FUSION HOST}/api/apps/{APP_NAME}
  description: Fusion app
  variables:
    FUSION HOST:
      default: FUSION_HOST
      description: Your environment host.
    APP_NAME:
      default: APP_NAME
      description: The name of your Fusion application.
tags:
- name: Swagger
  description: These endpoints give you details about Fusion's REST API schemas.
paths:
  /swagger:
    get:
      tags:
      - Swagger
      summary: Get the Fusion API spec (JSON)
      description: Get Fusion API spec as JSON.
      operationId: allJson
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
  /swagger/yaml:
    get:
      tags:
      - Swagger
      summary: Get the Fusion API spec (YAML)
      description: Get Fusion API spec as YAML.
      operationId: allYaml
      responses:
        '200':
          description: successful operation
          content:
            text/yaml:
              schema:
                type: string
  /swagger/multi-json:
    get:
      tags:
      - Swagger
      summary: Get Fusion per-service API specs (JSON)
      description: Get Fusion per-service API specs as JSON list.
      operationId: perServiceJson
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
  /swagger/multi-yaml:
    get:
      tags:
      - Swagger
      summary: Get Fusion per-service API specs (YAML)
      description: Get Fusion per-service API specs as concatenated YAML blocks.
      operationId: perServiceYaml
      responses:
        '200':
          description: successful operation
          content:
            text/yaml:
              schema:
                type: string
  /swagger/status:
    get:
      tags:
      - Swagger
      summary: Get swagger service status
      description: Check the status of the Swagger service.
      operationId: getStatus_25
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceStatus'
components:
  schemas:
    ServiceStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - starting
          - ok
          - warning
          - error
          - shutdown
        node:
          type: string
          readOnly: true
        messages:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/StatusMessage'
    StatusMessage:
      type: object
      properties:
        date:
          type: string
          format: date-time
          readOnly: true
        message:
          type: string
          readOnly: true
  securitySchemes:
    Basic_auth:
      type: http
      scheme: basic
    API_key:
      name: x-api-key
      type: apiKey
      in: header
x-original-swagger-version: '2.0'
x-provenance:
  method: harvested
  publisher: Lucidworks
  source: https://doc.lucidworks.com/api-reference/5.9/fusion-api-swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
