openapi: 3.2.0
info:
  title: Fusion Admin Solr API
  description: These APIs provide general administrative functions for your Fusion instance. Use these APIs to manage Fusion objects, App Studio objects, connections to Solr clusters, license files, job schedules, and more. You can also use them to create a history of service events.
  termsOfService: https://lucidworks.com/legal/developer-license-agreement/
  contact:
    name: Lucidworks
    url: www.lucidworks.com
    email: support@lucidworks.com
  license:
    name: License of API
    url: https://lucidworks.com/legal/developer-license-agreement/
  version: '5.9'
servers:
- url: https://{FUSION HOST}/api
  description: Fusion
  variables:
    FUSION HOST:
      default: FUSION_HOST
      description: Your environment host.
- url: https://{FUSION HOST}/api/apps/{APP_NAME}
  description: Fusion app
  variables:
    FUSION HOST:
      default: FUSION_HOST
      description: Your environment host.
    APP_NAME:
      default: APP_NAME
      description: The name of your Fusion application.
tags:
- name: Solr
  description: 'The Solr API is used to manage collection-level configurations.


    Since this API proxies requests to Solr, each available method corresponds to the method in Solr. So, a `GET` request to Solr would use the `GET` method of this endpoint; a `POST` would use the `POST` method, and so on.


    Depending on the request, the response may consist of records that match a query or output from a Schema API request.'
paths:
  /solr:
    get:
      tags:
      - Solr
      description: Internal-only.
      operationId: ok
      responses:
        '200':
          description: successful operation
          content: {}
      x-hidden: true
      summary: Ok
      x-summary-source: derived
  /solr/{collection}/{path}:
    get:
      tags:
      - Solr
      summary: Send a GET request to Solr
      description: Send a proxy request to Solr.
      operationId: proxyRequestToSolr
      parameters:
      - name: collection
        description: The collection ID.
        in: path
        required: true
        schema:
          type: string
      - name: path
        description: The Solr command path.
        in: path
        required: true
        schema:
          pattern: .*
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/InputStream'
        required: false
      responses:
        '200':
          description: Successful Solr response. The structure depends on the request path and handler, such as `/select` or `/update`.
          content:
            application/json:
              schema:
                type: object
                description: Arbitrary Solr response content depending on the handler invoked.
                additionalProperties: true
              examples:
                searchResult:
                  summary: Typical response from /select
                  value:
                    responseHeader:
                      status: 0
                      QTime: 2
                      params:
                        fl: title
                        q: solr
                        wt: json
                        rows: '2'
                    response:
                      numFound: 52
                      start: 0
                      docs:
                      - title:
                        - Solr and SolrAdmin APIs - Fusion Documentation - Lucidworks
                      - title:
                        - Search Clusters - Fusion Documentation - Lucidworks
      x-codegen-request-body-name: body
    put:
      tags:
      - Solr
      summary: Send a PUT request to Solr
      description: Send a proxy request to Solr.
      operationId: proxyPutRequestToSolr_1
      parameters:
      - name: collection
        description: The collection ID.
        in: path
        required: true
        schema:
          type: string
      - name: path
        description: The Solr command path.
        in: path
        required: true
        schema:
          pattern: .*
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/InputStream'
        required: false
      responses:
        '200':
          description: successful operation
          content: {}
      x-codegen-request-body-name: body
    post:
      tags:
      - Solr
      summary: Send a POST request to Solr
      description: Send a proxy request to Solr.
      operationId: proxyPostRequestToSolr_1
      parameters:
      - name: collection
        description: The collection ID.
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        description: The Solr command path.
        required: true
        schema:
          pattern: .*
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/InputStream'
        required: false
      responses:
        '200':
          description: successful operation
          content: {}
      x-codegen-request-body-name: body
    delete:
      tags:
      - Solr
      summary: Send a DELETE request to Solr
      description: Send a proxy request to Solr.
      operationId: proxyDeleteRequestToSolr_1
      parameters:
      - name: collection
        description: The collection ID.
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        description: The Solr command path.
        required: true
        schema:
          pattern: .*
          type: string
      requestBody:
        content:
          '*/*':
