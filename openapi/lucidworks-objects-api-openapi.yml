openapi: 3.2.0
info:
  title: Fusion Admin Objects API
  description: These APIs provide general administrative functions for your Fusion instance. Use these APIs to manage Fusion objects, App Studio objects, connections to Solr clusters, license files, job schedules, and more. You can also use them to create a history of service events.
  termsOfService: https://lucidworks.com/legal/developer-license-agreement/
  contact:
    name: Lucidworks
    url: www.lucidworks.com
    email: support@lucidworks.com
  license:
    name: License of API
    url: https://lucidworks.com/legal/developer-license-agreement/
  version: '5.9'
servers:
- url: https://{FUSION HOST}/api
  description: Fusion
  variables:
    FUSION HOST:
      default: FUSION_HOST
      description: Your environment host.
- url: https://{FUSION HOST}/api/apps/{APP_NAME}
  description: Fusion app
  variables:
    FUSION HOST:
      default: FUSION_HOST
      description: Your environment host.
    APP_NAME:
      default: APP_NAME
      description: The name of your Fusion application.
tags:
- name: Objects
  description: The Objects API lets you import and export objects between Fusion instances. Fusion objects include all your searchable data, plus pipelines, aggregations, and other configurations on which your collections depend.
paths:
  /objects/status:
    get:
      tags:
      - Objects
      summary: Get objects service status
      description: Check the status of the Objects service.
      operationId: getStatus_14
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceStatus'
  /objects/export:
    get:
      tags:
      - Objects
      summary: Export objects
      description: Export Fusion objects as JSON. Omit parameters to export all objects. When you export an app that includes objects that are shared with other apps, then all apps linked to that object are also exported.
      operationId: exportJson
      parameters:
      - name: type
        in: query
        description: 'One or more of: `collection`, `index-pipeline`, `query-pipeline`, `search-cluster`, `datasource`, `parser`, `group`, `link`, `task`, `job`, `spark`, `blob`, `appkit` or `app`.'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
        example:
        - datasource
        - index-pipeline
        - query-pipeline
      - name: type.ids
        in: query
        description: List the IDs to match for the specified object type, such as `datasource.ids=movies_csv-movie`. The `type` and `type.ids` parameters can be combined as needed.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: filterPolicy
        in: query
        description: 'One of:


          - `system`: Filter system objects when exporting a particular type of object.

          - `none`: Export all objects of that type.'
        schema:
          type: string
          default: system
          enum:
          - system
          - none
      - name: deep
        in: query
        description: Set to `true` to include all linked objects.
        schema:
          type: boolean
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportContainer'
  /objects/import:
    post:
      tags:
      - Objects
      summary: Import objects
      description: 'Import one or more objects. Validation is performed before import. Import starts only if validation succeeds. However, validation does not stop on the first error, so the complete list of errors is reported if there are any. You can also use the `/objects/validate` endpoint to validate an object without importing it.


        Validation includes checking whether an object already exists on the target system and whether the user is authorized to create or modify the object.


        For collection objects, the following special validation is performed:


        - We check the `searchClusterId` of each collection and verify that a cluster with this ID exists on the target system or in the import file (error).

        - We check that features, index profiles, and query profiles belong only to the collections specified in the import file (error).

        - We check that a feature exists on the target system for each feature in the import file (error).

        - We check for index profiles or query profiles that do not exist on the target system or in the import file (warning).


        You can also substitute the password variables in your imported file using a separate file containing plaintext passwords, like this: `-F ''variableValues=@password_file.json''`'
      operationId: importData
      parameters:
      - name: importPolicy
        in: query
        description: 'One of the following values:


          - `abort`: If there are conflicts, then import nothing.

          - `merge`: If there are conflicts, then skip the conflicting objects.

          - `overwrite`: If there are conflicts, then overwrite or delete/create the conflicting objects on the target system.'
        schema:
          type: string
          enum:
          - abort
          - merge
          - overwrite
        example: merge
      - name: context
        in: query
        description: The name of the Fusion app into which the objects will be imported.
        schema:
          type: string
        example: my-fusion-app
      requestBody:
        description: The objects to import.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FormDataMultiPart'
        required: false
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
      x-codegen-request-body-name: body
  /objects/substitutions:
    post:
      tags:
      - Objects
      summary: List imported variables
      description: Returns variables declared in an imported zip file.
      operationId: processSubstitutions
      requestBody:
        description: A zip file to import.
        content:
          application/zip:
            schema:
              $ref: '#/components/schemas/InputStream'
        required: false
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSubstitutions'
      x-codegen-request-body-name: body
  /objects/validate:
    post:
      tags:
      - Objects
      summary: Validate objects
      description: Validate the provided objects.
      operationId: validate
      requestBody:
        description: The objects to validate.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FormDataMultiPart'
        required: false
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
      x-codegen-request-body-name: body
components:
  schemas:
    IndexProfile:
      type: object
      properties:
        id:
          type: string
          readOnly: true
    ServiceStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - starting
          - ok
          - warning
          - error
          - shutdown
        node:
          type: string
          readOnly: true
        messages:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/StatusMessage'
    CompositeIdSpec:
      type: object
      properties:
        routeKey1Field:
          type: string
        routeKey1Bits:
          type: integer
          format: int32
        routeKey2Field:
          type: string
        routeKey2Bits:
          type: integer
          format: int32
    StatusMessage:
      type: object
      properties:
        date:
          type: string
          format: date-time
          readOnly: true
        message:
          type: string
          readOnly: true
    MultiPart:
      type: object
      properties:
        contentDisposition:
          $ref: '#/components/schemas/ContentDisposition'
        entity:
          type: object
          properties: {}
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        mediaType:
          $ref: '#/components/schemas/MediaType'
        messageBodyWorkers:
          $ref: '#/components/schemas/MessageBodyWorkers'
        parent:
          $ref: '#/components/schemas/MultiPart'
        providers:
          $ref: '#/components/schemas/Providers'
        bodyParts:
          type: array
          items:
            $ref: '#/components/schemas/BodyPart'
        parameterizedHeaders:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ParameterizedHeader'
    QueryPipelineDefinition:
      type: object
      properties:
        id:
          type: string
          readOnly: true
    CustomRuleTypeConfig:
      type: object
      properties:
        id:
          type: string
          readOnly: true
    ContentDisposition:
      type: object
      properties:
        type:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        fileName:
          type: string
        creationDate:
          type: string
          format: date-time
        modificationDate:
          type: string
          format: date-time
        readDate:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
    FormDataContentDisposition:
      type: object
      properties:
        type:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        fileName:
          type: string
        creationDate:
          type: string
          format: date-time
        modificationDate:
          type: string
          format: date-time
        readDate:
          type: string
          format: date-time
        size:
          type: integer
          format: int64
        name:
          type: string
    DataModelField:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        required:
          type: boolean
          readOnly: true
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/DataModelSolrFieldMapping'
    Feature:
      type: object
      properties:
        name:
          type: string
        collectionId:
          type: string
        params:
          type: object
          additionalProperties:
            type: object
            properties: {}
        enabled:
          type: boolean
    Collection:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
        searchClusterId:
          type: string
        autoCommit:
          type: integer
          format: int32
          description: Solr hard commit inherited from the collection's `solrconfig.xml` that is designated as Fusion's default parameter for Solr data commits. Number of seconds in which the data is saved, but this parameter does not force the search results to refresh immediately. With this setting, search performance is not slowed, but the new data may not show in search results until the next refresh. Default value is 15.
          default: 15
        autoSoftCommit:
          type: boolean
          default: 'false'
          description: Solr soft commit that does not save the data, but makes the data visible to searches almost immediately. If the system crashes, that new data is lost because it has not been saved. Default is false, and search visibility is managed using the `commitWithin` setting.
        commitWithin:
          type: integer
          format: int32
          description: Solr's `commitWithin` parameter, configured at the collection level with a default of `10000` milliseconds, ensures data is committed and available for searching within 10 seconds. The default for signals collections is `1000` milliseconds. Fusion uses `commitWithin` to avoid relying on specific Solr-side configurations. The `com.lucidworks.apollo.solr.commitWithin` global property defines the default `commitWithin` for all documents added through Fusion. When you create a new collection in Fusion, its per-collection `commitWithin` is initialized from this global default.
          default: 10000
        features:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Feature'
        compositeIdSpec:
          $ref: '#/components/schemas/CompositeIdSpec'
        solrParams:
          $ref: '#/components/schemas/CreateCollectionCmd'
        modifiedAt:
          type: string
          format: date-time
        type:
          type: string
          enum:
          - DATA
          - LOGS
          - METRICS
          - SIGNALS
          - SIGNALS_AGGREGATION
          - SEARCHLOGS
          - SYNONYMS
          - RECOMMENDATIONS
          - HISTORY
          - BLOBS
          - MESSAGES
          - TAXONOMY
          - CRAWL_DB
          - JOB_HISTORY
          - ARCHIVING
          - AUTOCOMPLETE_DOCUMENTS
          - QUERY_REWRITE
          - USER_PREFS
          - JOB_REPORTS
          - ACL
          - 'NULL'
        relatedCollectionId:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    AuthConfig:
      type: object
      properties:
        authType:
          type: string
          readOnly: true
          enum:
          - NONE
          - BASIC
          - KERBEROS
        username:
          type: string
          readOnly: true
        password:
          type: string
          readOnly: true
        keyTab:
          type: string
          readOnly: true
        principal:
          type: string
          readOnly: true
    MediaType:
      type: object
      properties:
        type:
          type: string
        subtype:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        wildcardType:
          type: boolean
        wildcardSubtype:
          type: boolean
    ImportResult:
      type: object
      properties:
        conflicts:
          type: array
          items:
            type: string
        variablesWarnings:
          type: array
          items:
            type: string
        variablesErrors:
          type: array
          items:
            type: string
        variablesSubstitutions:
          type: array
          items:
            type: string
        validationWarnings:
          type: array
          items:
            type: string
        validationErrors:
          type: array
          items:
            type: string
        importErrors:
          type: array
          items:
            type: string
        importActions:
          type: array
          items:
            type: string
        zipFileToken:
          type: string
        transformationMsgs:
          type: array
          items:
            type: string
        status:
          type: string
    MessageBodyWorkers:
      type: object
    FusionResource:
      anyOf:
      - type: string
        description: Resource reference as a string, such as 'datasource:ratings-db'
      - type: object
        properties:
          type:
            type: string
            enum:
            - APPKIT_APP
            - APP
            - COLLECTION
            - INDEX_PIPELINE
            - QUERY_PIPELINE
            - INDEX_PROFILE
            - QUERY_PROFILE
            - BLOB
            - PARSER
            - DATASOURCE
            - TASK
            - SCHEDULE
            - SEARCH_CLUSTER
            - EXPERIMENT
            - SPARK_JOB
            - GROUP
            - CUSTOM_RULE_TYPE
            - SUBSCRIPTION
            - DATA_MODEL
            - TEMPLATE
            - ZONE
            - TEMPLATE_SETTINGS
            - TYPE
            - RESOURCE
            - 'NULL'
          id:
            type: string
          uri:
            type: string
            format: uri
          canonicalName:
            type: string
        required:
        - type
    ParserConfig:
      type: object
      properties:
        id:
          type: string
          readOnly: true
    IndexPipelineDefinition:
      type: object
      properties:
        id:
          type: string
          readOnly: true
    Zone:
      type: object
      properties:
        id:
          type: string
          readOnly: true
    AppkitAppExportContainer:
      type: object
      properties:
        appkitApp:
          $ref: '#/components/schemas/AppkitApp'
        editingSessions:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/EditingSession'
    FusionApp:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
    FormDataBodyPart:
      type: object
      properties:
        contentDisposition:
          $ref: '#/components/schemas/ContentDisposition'
        entity:
          type: object
          properties: {}
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        mediaType:
          $ref: '#/components/schemas/MediaType'
        messageBodyWorkers:
          $ref: '#/components/schemas/MessageBodyWorkers'
        parent:
          $ref: '#/components/schemas/MultiPart'
        providers:
          $ref: '#/components/schemas/Providers'
        formDataContentDisposition:
          $ref: '#/components/schemas/FormDataContentDisposition'
        simple:
          type: boolean
        name:
          type: string
        value:
          type: string
        parameterizedHeaders:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ParameterizedHeader'
    FusionObjects:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        indexPipelines:
          type: array
          items:
            $ref: '#/components/schemas/IndexPipelineDefinition'
        queryPipelines:
          type: array
          items:
            $ref: '#/components/schemas/QueryPipelineDefinition'
        searchClusters:
          type: array
          items:
            $ref: '#/components/schemas/SearchCluster'
        features:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Feature'
        indexProfiles:
          type: array
          items:
            $ref: '#/components/schemas/IndexProfile'
        queryProfiles:
          type: array
          items:
            $ref: '#/components/schemas/QueryProfile'
        parsers:
          type: array
          items:
            $ref: '#/components/schemas/ParserConfig'
        objectGroups:
          type: array
          items:
            $ref: '#/components/schemas/ObjectGroup'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobConfig'
        sparkJobs:
          type: array
          items:
            $ref: '#/components/schemas/SparkJobConfig'
        blobs:
          type: array
          items:
            $ref: '#/components/schemas/Blob'
        experiments:
          type: array
          items:
            $ref: '#/components/schemas/Experiment'
        appkitApps:
          type: array
          items:
            $ref: '#/components/schemas/AppkitAppExportContainer'
        fusionApps:
          type: array
          items:
            $ref: '#/components/schemas/FusionApp'
        customRules:
          type: array
          items:
            $ref: '#/components/schemas/CustomRuleTypeConfig'
        templates:
          type: array
          items:
            $ref: '#/components/schemas/Template'
        zones:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        templateSettings:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSettings'
        dataModels:
          type: array
          items:
            $ref: '#/components/schemas/DataModel'
        dataSources:
          type: array
          items:
            $ref: '#/components/schemas/DataSource'
    Template:
      type: object
      properties:
        id:
          type: string
          readOnly: true
    JobTriggerConfig:
      type: object
      discriminator:
        propertyName: type
      properties:
        enabled:
          type: boolean
        type:
          type: string
          enum:
          - interval
          - cron
          - job
          x-enumDescriptions:
            interval: Run the job at a regular interval over some time range.
            cron: Run the job on a cron-style schedule.
            job: Run the job after another job succeeds or fails.
        startTime:
          type: string
          format: date-time
          description: The date and time at which the job will first run (ISO-8601 format). Applies to type 'interval'.
        endTime:
          type: string
          format: date-time
          description: The date and time at which the job will run last (ISO-8601 format). Applies to type 'interval'.
        interval:
          type: integer
          description: The interval at which the job will run. Applies to type 'interval'.
        repeatUnit:
          type: string
          enum:
          - minute
          - hour
          - day
          description: The unit for the interval. Applies to type 'interval'.
        value:
          type: string
          description: A cron string that defines the schedule. Applies to type 'cron'.
        jobID:
          type: string
          description: The ID of the job that triggers this one. Applies to type 'job'.
        runOnSuccess:
          type: boolean
          description: Run this job when the triggering job succeeds. Applies to type 'job'.
        runOnFailure:
          type: boolean
          description: Run this job when the triggering job fails. Applies to type 'job'.
        runOnAbort:
          type: boolean
          description: Run this job when the triggering job is aborted. Applies to type 'job'.
    InputStream:
      type: object
    SubstitutedProperty:
      type: object
      properties:
        id:
          type: string
        schema:
          $ref: '#/components/schemas/Schema'
    Subscription:
      type: object
      properties:
        id:
          type: string
          readOnly: true
    QueryProfile:
      type: object
      properties:
        id:
          type: string
          readOnly: true
    ExportContainer:
      type: object
      properties:
        objects:
          $ref: '#/components/schemas/FusionObjects'
        properties:
          type: array
          items:
            $ref: '#/components/schemas/SubstitutedProperty'
        metadata:
          $ref: '#/components/schemas/Metadata'
    Link:
      type: object
      properties:
        subject:
          $ref: '#/components/schemas/FusionResource'
        object:
          $ref: '#/components/schemas/FusionResource'
        linkType:
          type: string
          description: 'Possible link types:


            * `DependsOn` - The subject depends on the object.


            * `Supports` - The subject is depended on by the object (the reverse of `dependsOn`).


            * `IsPartOf` - The subject is part of the object, where the object is a group.


            * `HasPart` - The subject is a group, of which the object is a member (the reverse of `isPartOf`).


            * `RelatesTo` - The subject relates to the object. This is a uni-directional relationship that associates two objects that have none of the relationships described above.


            * `InContextOf` - The subject exists in the context of the object, which is an app.


            * `HasContext` - The subject is an app that contains the object.


            * `Self` - The subject and the object are the same.'
          readOnly: true
          enum:
          - dependsOn
          - supports
          - isPartOf
          - hasPart
          - relatesTo
          - inContextOf
          - hasContext
          - self
        originator:
          type: string
          readOnly: true
    TemplateSettings:
      type: object
      properties:
        id:
          type: string
        app:
          type: string
    ObjectGroup:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        isSystem:
          type: boolean
          readOnly: true
        description:
          type: string
          readOnly: true
    FormDataMultiPart:
      type: object
      properties:
        contentDisposition:
          $ref: '#/components/schemas/ContentDisposition'
        entity:
          type: object
          properties: {}
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        mediaType:
          $ref: '#/components/schemas/MediaType'
        messageBodyWorkers:
          $ref: '#/components/schemas/MessageBodyWorkers'
        parent:
          $ref: '#/components/schemas/MultiPart'
        providers:
          $ref: '#/components/schemas/Providers'
        bodyParts:
          type: array
          items:
            $ref: '#/components/schemas/BodyPart'
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/FormDataBodyPart'
        parameterizedHeaders:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ParameterizedHeader'
    DataModel:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
        indexPipeline:
          type: string
        queryPipeline:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/DataModelField'
    ParameterizedHeader:
      type: object
      properties:
        value:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
    AppkitApp:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        contextPath:
          type: string
          readOnly: true
        enabled:
          type: boolean
          readOnly: true
        type:
          type: string
        war:
          type: string
          readOnly: true
        warMd5:
          type: string
          readOnly: true
        warSize:
          type: integer
          format: int64
          readOnly: true
    DataModelSolrFieldMapping:
      type: object
      properties:
        solrField:
          type: string
        queryField:
          type: boolean
        phraseMatch:
          type: boolean
        boostValue:
          type: number
          format: double
        phraseBoost:
          type: number
          format: double
    EditingSession:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        owner:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        version:
          type: string
    JobConfig:
      type: object
      properties:
        resource:
          type: string
        enabled:
          type: boolean
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/JobTriggerConfig'
        default:
          type: boolean
    SparkJobConfig:
      type: object
      properties:
        id:
          type: string
          readOnly: true
    Task:
