openapi: 3.2.0
info:
  title: Fusion Admin Features API
  description: These APIs provide general administrative functions for your Fusion instance. Use these APIs to manage Fusion objects, App Studio objects, connections to Solr clusters, license files, job schedules, and more. You can also use them to create a history of service events.
  termsOfService: https://lucidworks.com/legal/developer-license-agreement/
  contact:
    name: Lucidworks
    url: www.lucidworks.com
    email: support@lucidworks.com
  license:
    name: License of API
    url: https://lucidworks.com/legal/developer-license-agreement/
  version: '5.9'
servers:
- url: https://{FUSION HOST}/api
  description: Fusion
  variables:
    FUSION HOST:
      default: FUSION_HOST
      description: Your environment host.
- url: https://{FUSION HOST}/api/apps/{APP_NAME}
  description: Fusion app
  variables:
    FUSION HOST:
      default: FUSION_HOST
      description: Your environment host.
    APP_NAME:
      default: APP_NAME
      description: The name of your Fusion application.
tags:
- name: Features
  description: The Features API lets you observe the status of features across collections. To manipulate features for a specific collection, use the Collections API.
paths:
  /features/status:
    get:
      tags:
      - Features
      summary: Get features service status
      description: Check the status of the Features service.
      operationId: getStatus_7
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceStatus'
              example:
              - name: searchLogs
                collectionId: demo
                params: {}
                enabled: false
              - name: signals
                collectionId: demo
                params: {}
                enabled: false
  /features:
    get:
      tags:
      - Features
      summary: List all features
      description: Fetch the list of existing features.
      operationId: listFeatures_1
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeatureSpec'
  /features/{feature}:
    get:
      tags:
      - Features
      summary: Get a feature
      description: Fetch details about a feature.
      operationId: getFeature_1
      parameters:
      - name: feature
        in: path
        description: 'The feature to update. Allowed values:


          - `signals`: Create a parallel collection for storing signals data (such as user clicks or ratings). Signals need to be indexed and aggregated before they can be used.

          - `recommendations`: Get configuration information about recommendations. Parameters include `idField` (document ID field), `itemsForUser` (enable or disable items-for-user recommendations), `itemsForQuery` (enable or disable items-for-query recommendations), `itemsForItem` (enable or disable items-for-item recommendations), and `queriesForQuery` (enable or disable queries-for-query recommendations).'
        required: true
        schema:
          type: string
          enum:
          - signals
          - recommendations
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureSpec'
  /features/{feature}/_schema:
    get:
      tags:
      - Features
      summary: Get feature configuration schema
      description: Get a feature's configuration schema.
      operationId: getFeatureSchema
      parameters:
      - name: feature
        in: path
        description: 'The feature to update. Allowed values:


          - `signals`: Create a parallel collection for storing signals data (such as user clicks or ratings). Signals need to be indexed and aggregated before they can be used.

          - `recommendations`: Get configuration information about recommendations. Parameters include `idField` (document ID field), `itemsForUser` (enable or disable items-for-user recommendations), `itemsForQuery` (enable or disable items-for-query recommendations), `itemsForItem` (enable or disable items-for-item recommendations), and `queriesForQuery` (enable or disable queries-for-query recommendations).'
        required: true
        schema:
          type: string
          enum:
          - signals
          - recommendations
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectType'
