  /system/status_code:
    get:
      tags:
      - System
      summary: Get the system status
      description: Check the status of the system.
      operationId: getStatusCode
      responses:
        '200':
          description: successful operation
          content: {}
  /system/version:
    get:
      tags:
      - System
      summary: Get the system version
      description: Get Fusion version information.
      operationId: ver
      responses:
        '200':
          description: successful operation
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /system/status:
    get:
      tags:
      - System
      summary: Get system status
      description: Check the status of the system.
      operationId: getStatus_28
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceStatus'
components:
  schemas:
    ServiceStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - starting
          - ok
          - warning
          - error
          - shutdown
        node:
          type: string
          readOnly: true
        messages:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/StatusMessage'
    StatusMessage:
      type: object
      properties:
        date:
          type: string
          format: date-time
          readOnly: true
        message:
          type: string
          readOnly: true
    Meter:
      type: object
      properties:
        count:
          type: integer
          format: int64
        fifteenMinuteRate:
          type: number
          format: double
        fiveMinuteRate:
          type: number
          format: double
        meanRate:
          type: number
          format: double
        oneMinuteRate:
          type: number
          format: double
    MetricRegistry:
      type: object
      properties:
        metrics:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Metric'
        names:
          uniqueItems: true
          type: array
          items:
            type: string
        gauges:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Gauge'
        counters:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Counter'
        histograms:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Histogram'
        meters:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Meter'
        timers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Timer'
    MetricResponse:
      type: object
      properties:
        metricRegistry:
          $ref: '#/components/schemas/MetricRegistry'
        metricsList:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Metric'
        pretty:
          type: boolean
        rateUnit:
          type: string
          enum:
          - NANOSECONDS
          - MICROSECONDS
          - MILLISECONDS
          - SECONDS
          - MINUTES
          - HOURS
          - DAYS
        durationUnit:
          type: string
          enum:
          - NANOSECONDS
          - MICROSECONDS
          - MILLISECONDS
          - SECONDS
          - MINUTES
          - HOURS
          - DAYS
        showSamples:
          type: boolean
    Timer:
      type: object
      properties:
        count:
          type: integer
          format: int64
        fifteenMinuteRate:
          type: number
          format: double
        fiveMinuteRate:
          type: number
          format: double
        meanRate:
          type: number
          format: double
        oneMinuteRate:
          type: number
          format: double
        snapshot:
          $ref: '#/components/schemas/Snapshot'
    Histogram:
      type: object
      properties:
        count:
          type: integer
          format: int64
        snapshot:
          $ref: '#/components/schemas/Snapshot'
    Gauge:
      type: object
      properties:
        value:
          type: object
          properties: {}
    Counter:
      type: object
      properties:
        count:
          type: integer
          format: int64
    Snapshot:
      type: object
      properties:
        min:
          type: integer
          format: int64
        values:
          type: array
          items:
            type: integer
            format: int64
        max:
          type: integer
          format: int64
        mean:
          type: number
          format: double
        stdDev:
          type: number
          format: double
        median:
          type: number
          format: double
        get75thPercentile:
          type: number
          format: double
        get95thPercentile:
          type: number
          format: double
        get98thPercentile:
          type: number
          format: double
        get99thPercentile:
          type: number
          format: double
        get999thPercentile:
          type: number
          format: double
    Metric:
      type: object
  securitySchemes:
    Basic_auth:
      type: http
      scheme: basic
    API_key:
      name: x-api-key
      type: apiKey
      in: header
