openapi: 3.2.0
info:
  title: Fusion Admin Tasks API
  description: These APIs provide general administrative functions for your Fusion instance. Use these APIs to manage Fusion objects, App Studio objects, connections to Solr clusters, license files, job schedules, and more. You can also use them to create a history of service events.
  termsOfService: https://lucidworks.com/legal/developer-license-agreement/
  contact:
    name: Lucidworks
    url: www.lucidworks.com
    email: support@lucidworks.com
  license:
    name: License of API
    url: https://lucidworks.com/legal/developer-license-agreement/
  version: '5.9'
servers:
- url: https://{FUSION HOST}/api
  description: Fusion
  variables:
    FUSION HOST:
      default: FUSION_HOST
      description: Your environment host.
- url: https://{FUSION HOST}/api/apps/{APP_NAME}
  description: Fusion app
  variables:
    FUSION HOST:
      default: FUSION_HOST
      description: Your environment host.
    APP_NAME:
      default: APP_NAME
      description: The name of your Fusion application.
tags:
- name: Tasks
  description: These endpoints let you manage tasks, a flexible job type that can be used to clean up old logs or run any REST call.
paths:
  /tasks/{id}:
    get:
      tags:
      - Tasks
      summary: Get a task
      description: Get the specified task.
      operationId: getEntity_5
      parameters:
      - name: id
        in: path
        description: The task ID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
    put:
      tags:
      - Tasks
      summary: Update a task
      description: Update a task's configuration.
      operationId: updateEntity
      parameters:
      - name: id
        in: path
        description: The task ID.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: An optional tag to match.
        schema:
          type: string
          default: '-1'
      requestBody:
        description: JSON-formatted configuration values.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
        required: false
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
      x-codegen-request-body-name: body
    delete:
      tags:
      - Tasks
      summary: Delete a task
      description: Delete a task.
      operationId: deleteEntityWithBody_4
      parameters:
      - name: id
        in: path
        description: The task ID.
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: An optional tag to match.
        schema:
          type: string
          default: '-1'
      requestBody:
        description: For supplying additional request parameters (such as relatedObjectIds) via request body instead of as request parameters. Use this if the URL is getting too long.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyRequestParams'
        required: false
      responses:
        '200':
          description: successful operation
          content: {}
      x-codegen-request-body-name: body
  /tasks/status:
    get:
      tags:
      - Tasks
      summary: Get tasks service status
      description: Check the status of the Tasks service.
      operationId: getStatus_29
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceStatus'
  /tasks:
    get:
      tags:
      - Tasks
      summary: List all tasks
      description: Fetch the list of existing tasks.
      operationId: getAllEntities_4
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      tags:
      - Tasks
      summary: Create a task
      description: Create a new task.
      operationId: createEntity
      requestBody:
        description: JSON-formatted configuration values.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
            example:
              type: rest-call
              id: test-task-created
              callParams:
                uri: solr://system_jobs_history/update
                method: post
                queryParams:
                  wt: json
                headers: {}
                entity: <root><delete><query>timestamp_dt:[* TO NOW-30DAYS] AND type_s:history</query></delete><commit /></root>
        required: false
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
      x-codegen-request-body-name: body
  /tasks/_schema:
    get:
      tags:
      - Tasks
      summary: Get the tasks schema
      description: Get JSON configuration schema for tasks.
      operationId: getEntitySchema_4
      responses:
        '200':
          description: successful operation
          content:
            application/schema+json; qs=1.0:
              schema:
                $ref: '#/components/schemas/ObjectType'
            application/json; qs=0.9:
              schema:
                $ref: '#/components/schemas/ObjectType'
  /tasks/_backcompat/{id}:
    delete:
      tags:
      - Tasks
      summary: Delete a task (backward compatibility)
      description: Delete a task using the backward compatibility endpoint. Use this endpoint for legacy task deletion operations.
      operationId: deleteEntity
      parameters:
      - name: id
        in: path
        description: The entity ID
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        description: An entity tag to match
        required: false
        schema:
          type: string
          default: '-1'
      responses:
        '200':
          description: Successfully deleted entity
      deprecated: true
